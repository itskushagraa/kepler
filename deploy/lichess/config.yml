# The real token is supplied only through LICHESS_BOT_TOKEN. Keeping this
# placeholder in version control prevents credentials from entering the repo.
token: "set-via-LICHESS_BOT_TOKEN"
url: "https://lichess.org/"

engine:
  # lichess-bot runs from .local/lichess-bot, so these paths resolve back to
  # the Kepler checkout without embedding a machine-specific absolute path.
  dir: "../../build-release"
  name: "kepler"
  working_dir: "../.."
  protocol: "uci"
  debug: false
  ponder: false
  silence_stderr: false

  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: false

  polyglot:
    enabled: false

  online_moves:
    max_retries: 2
    chessdb_book:
      enabled: false
    lichess_cloud_analysis:
      enabled: false
    lichess_opening_explorer:
      enabled: false
    online_egtb:
      enabled: false

  lichess_bot_tbs:
    syzygy:
      enabled: false
    gaviota:
      enabled: false

  uci_options:
    Hash: 256
    Threads: 4
    # Measured move POSTs are commonly 0.7--0.8 seconds. Kepler accounts for
    # this on every anticipated move, so bullet does not spend the network
    # portion of its clock on search.
    MoveOverhead: 900
    UseBaseline: true

abort_time: 30
# Keep a separate last-second reserve in the bridge for setup and HTTP jitter.
move_overhead: 3000
rate_limiting_delay: 100
max_takebacks_accepted: 0
quit_after_all_games_finish: true
pgn_directory: "../../deploy/lichess/games"
pgn_file_grouping: "all"

correspondence:
  ponder: false

# One standard, casual, human game at a time. Accept 1+0 bullet and slower
# real-time controls; correspondence remains disabled.
challenge:
  concurrency: 1
  games_reserved_for_humans: 0
  sort_by: "first"
  preference: "human"
  accept_bot: false
  only_bot: false
  min_base: 60
  max_base: 10800
  min_increment: 0
  max_increment: 180
  variants:
    - standard
  time_controls:
    - bullet
    - blitz
    - rapid
    - classical
  modes:
    - casual
  bullet_requires_increment: false
  max_simultaneous_games_per_user: 1

greeting:
  hello: "Hi, {opponent}! I'm Kepler, a C++ chess engine. Glhf!"
  goodbye: "Good game!"
  hello_spectators: "Kepler is a homemade C++ chess engine."
  goodbye_spectators: "Thanks for watching!"

matchmaking:
  allow_matchmaking: false
  challenge_filter: "none"
  rating_preference: "none"
